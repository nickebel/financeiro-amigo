name: Hallmark design audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Financeiro Amigo with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout Hallmark v2.0.0
        uses: actions/checkout@v4
        with:
          repository: Nutlope/hallmark
          ref: 04977e15f3dfd6ee4b74c887dac3eb52665d6c92
          path: .tools/hallmark
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check offline-store.js
          node --check pwa.js
          node --check sw.js
          node --check portal.js
      - name: Install browser audit dependencies
        run: npm install --no-save --package-lock=false puppeteer-core
      - name: Record the original app screen
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^1)"
          fi
          BASELINE_DIR="$RUNNER_TEMP/hallmark-before"
          mkdir -p "$BASELINE_DIR/.tools"
          git archive "$BASE_SHA" | tar -x -C "$BASELINE_DIR"
          cp -R .tools/hallmark "$BASELINE_DIR/.tools/hallmark"
          (
            cd "$BASELINE_DIR"
            node .tools/hallmark/skills/hallmark/scripts/sloplint.mjs . --scope app --genre modern-minimal --render --before || true
            test -f .hallmark/before.json
          )
          mkdir -p .hallmark
          cp -R "$BASELINE_DIR/.hallmark/." .hallmark/
      - name: Audit the redesign and preserve existing wiring
        run: node .tools/hallmark/skills/hallmark/scripts/sloplint.mjs . --scope app --genre modern-minimal --render --kept
      - name: Upload Hallmark comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hallmark-before-after
          path: |
            .hallmark/
          if-no-files-found: warn
          include-hidden-files: true
